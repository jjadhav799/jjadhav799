 <text x="860" class="h">SOFTWARE</text><text x="1080" class="v">84%</text><rect x="860" y="45" width="260" height="12" rx="6" class="b"/><rect x="860" y="45" width="218" height="12" rx="6" class="f p"/>
</g>
<text x="50" y="330" font="600 15px Arial" fill="#777">* Visual telemetry represents engineering focus, not measured proficiency.</text>
