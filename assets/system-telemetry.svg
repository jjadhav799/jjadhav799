 <text x="430" class="h">KUBERNETES</text><text x="680" class="v">94%</text><rect x="430" y="45" width="300" height="12" rx="6" class="b"/><rect x="430" y="45" width="282" height="12" rx="6" class="f p"/>
 <text x="860" class="h">AI CORE</text><text x="1080" class="v">71%</text><rect x="860" y="45" width="260" height="12" rx="6" class="b"/><rect x="860" y="45" width="185" height="12" rx="6" class="f p"/>
</g>
<g transform="translate(50,205)">
 <text class="h">AUTOMATION</text><text x="250" class="v">97%</text><rect y="45" width="300" height="12" rx="6" class="b"/><rect y="45" width="291" height="12" rx="6" class="f p"/>
