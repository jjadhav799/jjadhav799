<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop stop-color="#0b0b0b"/><stop offset="1" stop-color="#210407"/></linearGradient>
 <style>
 .h{font:800 20px Arial;fill:#fff;letter-spacing:3px}.v{font:900 32px Arial;fill:#e50914}.b{fill:#252525}.f{fill:#e50914}
 .p{animation:p 2s ease-in-out infinite}@keyframes p{50%{opacity:.55}}
 </style>
</defs>
<rect width="1200" height="360" rx="20" fill="url(#g)" stroke="#3a0a0d"/>
