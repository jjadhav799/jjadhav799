<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620">
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#050505"/>
    <stop offset=".55" stop-color="#180306"/>
    <stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#e50914" stop-opacity=".55"/>
    <stop offset="1" stop-color="#e50914" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-opacity=".7"/></filter>
  <style>
    .small{font:700 18px Arial,sans-serif;letter-spacing:4px;fill:#aaa}
    .title{font:900 100px Arial,sans-serif;letter-spacing:-3px;fill:white}
    .sub{font:700 25px Arial,sans-serif;letter-spacing:5px;fill:#e50914}
    .body{font:500 23px Arial,sans-serif;fill:#ddd}
    .pulse{animation:p 2.4s ease-in-out infinite}
    .scan{animation:s 5s linear infinite}
    @keyframes p{50%{opacity:.35}}
    @keyframes s{0%{transform:translateX(-1200px)}100%{transform:translateX(1200px)}}
  </style>
</defs>
<rect width="1600" height="620" fill="url(#bg)"/>
<circle cx="1250" cy="180" r="420" fill="url(#glow)" filter="url(#blur)"/>
<g opacity=".16" stroke="#e50914">
  <path d="M980 620L1460 0M1080 620L1560 0M1180 620L1660 0" stroke-width="2"/>
  <path d="M850 500H1600M900 400H1600M950 300H1600" stroke-width="1"/>
</g>
<rect class="scan" x="-1200" y="0" width="1200" height="2" fill="#e50914" opacity=".45"/>
<g transform="translate(100,92)">
  <text class="small">JAYFLIX ORIGINAL</text>
  <text y="115" class="title">JAYESH</text>
  <text y="205" class="title">JADHAV</text>
  <text y="258" class="sub">DEVOPS ENGINEER • SYSTEM BUILDER</text>
  <text y="320" class="body">CLOUD  ·  KUBERNETES  ·  AUTOMATION  ·  SOFTWARE  ·  AI</text>
  <g transform="translate(0,370)">
    <rect width="150" height="52" rx="5" fill="#e50914"/>
    <text x="28" y="34" font="700 19px Arial" fill="white">▶ PLAY</text>
    <rect x="168" width="190" height="52" rx="5" fill="#333" fill-opacity=".85"/>
    <text x="190" y="34" font="700 18px Arial" fill="white">＋ MY LIST</text>
  </g>
</g>
<g transform="translate(1210,110)" filter="url(#shadow)">
  <circle cx="140" cy="140" r="145" fill="#080808" stroke="#e50914" stroke-width="3"/>
  <path d="M75 75L112 205L155 75M155 75L198 205L235 75" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="140" cy="140" r="175" fill="none" stroke="#e50914" stroke-opacity=".3" stroke-width="2"/>
</g>
<text x="1250" y="500" class="small">NOW STREAMING: ENGINEERING</text>
</svg>