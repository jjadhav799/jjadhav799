<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21070a"/><stop offset=".45" stop-color="#b20710"/><stop offset=".72" stop-color="#4b070b"/><stop offset="1" stop-color="#160609"/></linearGradient>
 <radialGradient id="r"><stop stop-color="#ff2634" stop-opacity=".55"/><stop offset="1" stop-color="#ff2634" stop-opacity="0"/></radialGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#070707" stop-opacity=".82"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
 <style>
 .brand{font:900 38px Arial;letter-spacing:8px;fill:#fff}
 .micro{font:800 16px Arial;letter-spacing:5px;fill:#ffc5c8}
 .title{font:900 92px Arial;letter-spacing:-5px;fill:#fff}
 .sub{font:800 23px Arial;letter-spacing:5px;fill:#fff}
 .body{font:500 21px Arial;fill:#f2dfe0}
 .btn{font:900 18px Arial;fill:#fff}
 </style>
</defs>
<rect width="1600" height="720" fill="url(#bg)"/>
<circle cx="1260" cy="210" r="430" fill="url(#r)" filter="url(#blur)"/>
<g opacity=".18" stroke="#ffb2b7" fill="none">
 <path d="M850 720L1430 0M980 720L1560 0M1110 720L1690 0" stroke-width="2"/>
 <path d="M830 580H1600M870 470H1600M910 360H1600M950 250H1600" stroke-width="1"/>
</g>
<g transform="translate(100,80)">
 <text class="brand">JAYFLIX</text>
