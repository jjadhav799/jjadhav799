 <text y="175" class="title">JAYESH</text>
 <text y="265" class="title">JADHAV</text>
 <text y="315" class="sub">DEVOPS ENGINEER · SYSTEM BUILDER</text>
 <text y="365" class="body">Cloud  ·  Kubernetes  ·  Automation  ·  Software  ·  AI</text>
 <g transform="translate(0,410)">
   <rect width="142" height="52" rx="6" fill="#fff"/><text x="30" y="34" class="btn" fill="#111">▶ PLAY</text>
   <rect x="160" width="174" height="52" rx="6" fill="#3b1719" stroke="#f6b7ba"/><text x="184" y="34" class="btn">＋ MY LIST</text>
 </g>
</g>
<g transform="translate(1160,80)">
 <circle cx="170" cy="170" r="168" fill="#250608" stroke="#ffb1b5" stroke-width="2" opacity=".85"/>
 <circle cx="170" cy="170" r="132" fill="#e50914" opacity=".22"/>
 <path d="M90 90L128 250L170 90L212 250L250 90" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="170" cy="170" r="192" fill="none" stroke="#ff3844" stroke-width="2" opacity=".65"/>
 <text x="170" y="425" text-anchor="middle" class="micro">NOW STREAMING</text>
 <text x="170" y="456" text-anchor="middle" class="brand" font-size="24">ENGINEERING</text>
</g>
<rect y="0" width="1600" height="720" fill="url(#fade)"/>
</svg>